        body {

            background-attachment: fixed;

        /* Glassmorphism utilities */
        .glass-panel {
            background: linear-gradient(135deg, rgba(40, 40, 40, 0.7) 0%, rgba(30, 30, 30, 0.4) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .segmented-control {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .segmented-btn-active {
            background: linear-gradient(180deg, #3D3D3D 0%, #282828 100%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Vertical Slider Styling */
        .vertical-slider-container {
            position: relative;
            height: 200px;
            width: 100%;
            background: #3D3D3D;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .vertical-slider-fill-red {
            background: #EF202C;
            width: 100%;
            height: 80%;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }
        
        .vertical-slider-fill-nir {
            background: #7A5AF8;
            width: 100%;
            height: 100%;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .vertical-slider-thumb {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 6px;
            background: #FFFFFF;
            border-radius: 3px;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }
        
        /* Atmospheric Glow */
        .glow-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(239, 32, 44, 0.15) 0%, rgba(20, 20, 20, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }
