<style>
        .glass-panel {
            background: rgba(40, 40, 40, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-red {
            box-shadow: 0 0 15px rgba(239, 32, 44, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col pb-24">
<!-- Top Navigation Container (Not TopAppBar Shell) -->
<header class="px-screen-margin pt-12 pb-6 flex items-center justify-center relative">
<!-- Back Button -->
<button class="absolute left-screen-margin text-on-surface-muted hover:text-on-surface transition-colors flex items-center justify-center w-10 h-10 rounded-full bg-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Segmented Control -->
<div class="bg-surface rounded-full p-1 flex">
<button class="px-6 py-2 rounded-full font-label-md text-label-md text-on-surface-muted hover:text-on-surface transition-colors">Manual</button>
<button class="px-6 py-2 rounded-full font-label-md text-label-md bg-surface-high text-on-surface shadow-sm transition-colors">Presets</button>
</div>
</header>
<main class="flex-1 px-screen-margin flex flex-col gap-xl">
<!-- Header -->
<div class="flex flex-col gap-1">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Target Area</h1>
<p class="font-body-md text-body-md text-on-surface-muted">Select body part to optimize dose.</p>
</div>
<!-- Target Grid -->
<div class="grid grid-cols-3 gap-md">
<!-- Selected Item -->
<button class="glass-panel glow-red rounded-xl p-md flex flex-col items-center justify-center gap-sm aspect-square border-channel-red border opacity-100 transition-all">
<span class="material-symbols-outlined text-[32px] text-channel-red" style="font-variation-settings: 'FILL' 1;">face</span>
<span class="font-label-md text-label-md text-channel-red">Face</span>
</button>
<!-- Inactive Items -->
<button class="bg-surface rounded-xl p-md flex flex-col items-center justify-center gap-sm aspect-square opacity-60 hover:opacity-100 transition-all border border-transparent">
<span class="material-symbols-outlined text-[32px] text-on-surface-muted">accessibility_new</span>
<span class="font-label-md text-label-md text-on-surface-muted">Back</span>
</button>
<button class="bg-surface rounded-xl p-md flex flex-col items-center justify-center gap-sm aspect-square opacity-60 hover:opacity-100 transition-all border border-transparent">
<span class="material-symbols-outlined text-[32px] text-on-surface-muted">sports_gymnastics</span>
<span class="font-label-md text-label-md text-on-surface-muted">Shoulders</span>
</button>
<button class="bg-surface rounded-xl p-md flex flex-col items-center justify-center gap-sm aspect-square opacity-60 hover:opacity-100 transition-all border border-transparent">
<span class="material-symbols-outlined text-[32px] text-on-surface-muted">airline_seat_legroom_extra</span>
<span class="font-label-md text-label-md text-on-surface-muted">Knees</span>
</button>
<button class="bg-surface rounded-xl p-md flex flex-col items-center justify-center gap-sm aspect-square opacity-60 hover:opacity-100 transition-all border border-transparent">
<span class="material-symbols-outlined text-[32px] text-on-surface-muted">join_inner</span>
<span class="font-label-md text-label-md text-on-surface-muted">Joints</span>
</button>
</div>
<!-- Dose Intelligence Card -->
<div class="glass-panel rounded-xl p-card-padding flex flex-col gap-md mt-sm">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-muted uppercase tracking-widest">Dose Limit</span>
<span class="font-metric-md text-metric-md text-on-surface mt-1">22 <span class="text-on-surface-muted font-metric-sm text-metric-sm">/ 30 min</span></span>
</div>
<div class="bg-warning/20 text-warning px-3 py-1 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">warning</span>
<span class="font-label-sm text-label-sm">Nearing Limit</span>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-2 bg-surface-high rounded-full overflow-hidden mt-2">
<div class="h-full bg-channel-red rounded-full" style="width: 73%;"></div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-muted mt-1">Recommended daily exposure for facial skin rejuvenation. Exceeding may reduce efficacy.</p>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-screen-margin bg-gradient-to-t from-background via-background to-transparent z-40 pb-8 pt-12">
<button class="w-full h-[52px] bg-channel-red text-white font-label-lg text-label-lg rounded-full flex items-center justify-center gap-sm glow-red active:scale-95 transition-transform">
            Confirm &amp; Start
            <span class="material-symbols-outlined">play_arrow</span>
</button>
</div>
