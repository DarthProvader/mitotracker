<style>
        body { 
            background-color: #141414; 
            color: #F2F2F2; 
            background-image: radial-gradient(circle at 50% -20%, rgba(92, 10, 27, 0.15) 0%, rgba(20, 20, 20, 1) 60%);
            background-attachment: fixed;
        }
        
        /* Glassmorphism utilities */
        .glass-panel {
            background: linear-gradient(135deg, rgba(40, 40, 40, 0.7) 0%, rgba(30, 30, 30, 0.4) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        .segmented-control {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .segmented-btn-active {
            background: linear-gradient(180deg, #3D3D3D 0%, #282828 100%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        
        /* Red Channel Slider */
        .slider-red::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .slider-red::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #EF202C;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            box-shadow: 0 0 15px rgba(239, 32, 44, 0.6), inset 0 2px 4px rgba(255,255,255,0.3);
            border: 2px solid #fff;
        }
        
        /* NIR Channel Slider */
        .slider-nir::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .slider-nir::-webkit-slider-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #7A5AF8;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -9px;
            box-shadow: 0 0 15px rgba(122, 90, 248, 0.6), inset 0 2px 4px rgba(255,255,255,0.3);
            border: 2px solid #fff;
        }
        
        /* Atmospheric Glow */
        .glow-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(239, 32, 44, 0.15) 0%, rgba(20, 20, 20, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }
    </style>

<body class="antialiased min-h-screen flex flex-col font-body-md pb-24">

</div>

</div>

</div>
<div>

</div>
</div>
<span class="text-metric-md font-metric-md text-on-surface">80%</span>
</div>
<div class="pt-2 pb-1">

</div>
</div>
<!-- NIR Channel Control -->

</div>

</section>
<!-- Action Area -->
<div class="mt-auto pt-lg w-full flex justify-center pb-xl">
<button class="bg-btn-gradient text-white w-full h-[64px] rounded-2xl flex items-center justify-center gap-3 transition-all shadow-[0_8px_30px_rgba(245,5,55,0.4)] hover:shadow-[0_8px_40px_rgba(245,5,55,0.6)] active:scale-[0.98] border border-white/20">
